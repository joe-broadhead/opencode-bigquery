name: release

# Publishes v<version> from the tag `plugin-kit release` cut on a master commit whose CI passed.
# The kit cuts the tag; this workflow builds, checks again, and attaches dist/, SHA256SUMS and the conformance report.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # actionlint parses the workflows as workflows, not as YAML: `npm run check` includes that stage.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Keep the conformance report
        run: npx plugin-kit conformance --json > conformance-report.json
      - name: Pack, and write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cp dist/index.js release/index.js
          cp conformance-report.json release/conformance-report.json
          cd release
          for file in *; do [ "$file" != "SHA256SUMS" ] && printf '%s\n' "$file"; done | sort > ../sums-list.txt
          while IFS= read -r file; do sha256sum "$file"; done < ../sums-list.txt > SHA256SUMS
          cd ..
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
